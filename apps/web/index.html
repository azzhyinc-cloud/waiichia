    <!-- ===== AJOUT : CSS CRITIQUE ANTI-FLASH ===== -->
    <!-- Applique le fond sombre immédiatement, avant que le CSS Vite soit chargé -->
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html,body,#root{height:100%;background:#0a0e14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
      #wai-splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:linear-gradient(135deg,#0a0e14 0%,#0f0a1e 100%);z-index:9999;transition:opacity .4s ease,visibility .4s ease}
      #wai-splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
      #wai-splash-logo{width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#f5a623,#e8920a);display:flex;align-items:center;justify-content:center;font-size:36px;animation:wai-pulse 1.2s ease-in-out infinite alternate;box-shadow:0 8px 32px rgba(245,166,35,.4)}
      #wai-splash-name{font-size:24px;font-weight:800;letter-spacing:3px;color:#f5a623;font-family:'Syne',sans-serif}
      #wai-splash-sub{font-size:12px;color:#666;letter-spacing:1px}
      #wai-splash-bar{width:140px;height:3px;border-radius:2px;background:#1a1f2e;overflow:hidden}
      #wai-splash-bar::after{content:'';display:block;height:100%;width:45%;background:linear-gradient(90deg,#f5a623,#e8920a);border-radius:2px;animation:wai-slide 1s ease-in-out infinite alternate}
      @keyframes wai-pulse{from{transform:scale(1)}to{transform:scale(1.07)}}
      @keyframes wai-slide{from{transform:translateX(0)}to{transform:translateX(185%)}}
    </style>
    <!-- ===== FIN AJOUT CSS CRITIQUE ===== -->
  </head>
  <body>

    <!-- ===== AJOUT : SPLASH SCREEN ===== -->
    <div id="wai-splash">
      <div id="wai-splash-logo">🎵</div>
      <div id="wai-splash-name">WAIICHIA</div>
      <div id="wai-splash-sub">La plateforme audio africaine</div>
      <div id="wai-splash-bar"></div>
    </div>
    <!-- ===== FIN AJOUT SPLASH ===== -->

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- ===== SERVICE WORKER REGISTRATION ===== -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js?v=4').then(function(reg) {
            console.log('[SW] Enregistré ✅ scope:', reg.scope);
            reg.addEventListener('updatefound', function() {
              var newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'activated') {
                    console.log('[SW] Nouvelle version activée');
                  }
                });
              }
            });
          }).catch(function(err) {
            console.warn('[SW] Échec enregistrement:', err);
          });
        });
      }

      // ===== AJOUT : cacher le splash dès que React monte =====
      (function() {
        var splash = document.getElementById('wai-splash');
        if (!splash) return;
        var obs = new MutationObserver(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            splash.classList.add('hidden');
            setTimeout(function(){ if(splash.parentNode) splash.parentNode.removeChild(splash); }, 500);
            obs.disconnect();
          }
        });
        obs.observe(document.body, { childList: true, subtree: true });
        // Failsafe : disparaît après 4s quoi qu'il arrive
        setTimeout(function(){
          splash.classList.add('hidden');
          setTimeout(function(){ if(splash.parentNode) splash.parentNode.removeChild(splash); }, 500);
        }, 4000);
      })();
      // ===== FIN AJOUT =====
    </script>
  </body>
