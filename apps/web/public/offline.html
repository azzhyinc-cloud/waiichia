<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Waiichia — Hors ligne</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0a0e14;color:#e8e6e3;font-family:'Plus Jakarta Sans',system-ui,sans-serif;
      display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
    .box{max-width:360px}
    .icon{font-size:64px;margin-bottom:20px}
    h1{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin-bottom:10px;
      background:linear-gradient(135deg,#f5a623,#e8920a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    p{color:#8a8a8a;font-size:14px;line-height:1.6;margin-bottom:24px}
    button{padding:12px 32px;border-radius:50px;border:none;
      background:linear-gradient(135deg,#f5a623,#e8920a);color:#000;
      font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
    button:active{transform:scale(.97)}
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>Vous êtes hors ligne</h1>
    <p>Impossible de se connecter à Waiichia. Vérifiez votre connexion internet et réessayez.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
